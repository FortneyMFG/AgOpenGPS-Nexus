name: build-components-reusable
on:
  workflow_call:
    inputs:
      component:
        required: true
        type: string
      runtime:
        required: true
        type: string
      version:
        required: true
        type: string

jobs:
  build:
    name: Build ${{ inputs.component }} for ${{ inputs.runtime }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUNTIME: ${{ inputs.runtime }}
      VERSION: ${{ inputs.version }}
      CFG: Release
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }

      - name: Restore
        run: dotnet restore

      - name: Resolve project
        id: paths
        shell: bash
        run: |
          comp="${{ inputs.component }}"
          case "$comp" in
            core)
              echo "proj=Nexus SourceCode/src/Aog.Core/Aog.Core.csproj" >> "$GITHUB_OUTPUT"
              echo "dir=core" >> "$GITHUB_OUTPUT"
              echo "archive=core" >> "$GITHUB_OUTPUT"
              ;;
            agio)
              echo "proj=Nexus SourceCode/src/Aog.Agio/Aog.Agio.csproj" >> "$GITHUB_OUTPUT"
              echo "dir=agio" >> "$GITHUB_OUTPUT"
              echo "archive=agio" >> "$GITHUB_OUTPUT"
              ;;
            ui)
              echo "proj=Nexus SourceCode/src/Aog.UI.Avalonia/Aog.UI.Avalonia.csproj" >> "$GITHUB_OUTPUT"
              echo "dir=ui" >> "$GITHUB_OUTPUT"
              echo "archive=ui" >> "$GITHUB_OUTPUT"
              ;;
            plugin:*)
              plug="${comp#plugin:}"
              if [[ -z "$plug" ]]; then echo "Plugin name missing" >&2; exit 1; fi
              echo "proj=Nexus SourceCode/src/Aog.Plugins/Aog.Plugins.csproj" >> "$GITHUB_OUTPUT"
              echo "dir=Plugin-$plug" >> "$GITHUB_OUTPUT"
              echo "archive=Plugin-$plug" >> "$GITHUB_OUTPUT"
              echo "plugin=$plug" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown component: $comp" >&2
              exit 1
              ;;
          esac

      - name: Publish self-contained
        run: |
          dotnet publish "${{ steps.paths.outputs.proj }}" \
            -c $CFG -r $RUNTIME --self-contained true \
            /p:PublishSingleFile=true /p:PublishTrimmed=false \
            -o "out/${{ steps.paths.outputs.dir }}/${RUNTIME}"

      - name: Package docs & extras
        run: |
          mkdir -p "out/${{ steps.paths.outputs.dir }}/${RUNTIME}/docs"
          cp -R packaging/common/. "out/${{ steps.paths.outputs.dir }}/${RUNTIME}/" || true
          cp docs/COMPONENT-README.md "out/${{ steps.paths.outputs.dir }}/${RUNTIME}/README-${{ steps.paths.outputs.archive }}.md" || true

      - name: Archive
        id: arc
        shell: bash
        run: |
          cd "out/${{ steps.paths.outputs.dir }}"
          name="${{ steps.paths.outputs.archive }}_v${VERSION}_${RUNTIME}"
          if [[ "$RUNTIME" == win-* ]]; then
            7z a -r "${name}.zip" "${RUNTIME}/*"
            echo "archive=${{ github.workspace }}/out/${{ steps.paths.outputs.dir }}/${name}.zip" >> $GITHUB_OUTPUT
          else
            tar -czf "${name}.tar.gz" "${RUNTIME}"
            echo "archive=${{ github.workspace }}/out/${{ steps.paths.outputs.dir }}/${name}.tar.gz" >> $GITHUB_OUTPUT
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.paths.outputs.archive }}_${{ inputs.runtime }}
          path: ${{ steps.arc.outputs.archive }}
