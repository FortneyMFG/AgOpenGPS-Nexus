name: Nexus Release Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (defaults to current ref on push)'
        required: false

jobs:
  build-windows:
    name: Windows packaging
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore solution
        run: dotnet restore "Nexus SourceCode/AgOpenGPS.Nexus.sln"

      - name: Build solution
        run: dotnet build "Nexus SourceCode/AgOpenGPS.Nexus.sln" --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test "Nexus SourceCode/AgOpenGPS.Nexus.sln" --no-build --configuration Release

      - name: Package Windows artifacts
        shell: pwsh
        run: ./tools/ci/package-windows.ps1 -Configuration Release

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            artifacts/windows/AgOpenGPS.Nexus-win-x64.exe
            artifacts/windows/AgOpenGPS.Nexus-win-x64.zip
            artifacts/windows/AgOpenGPS.Nexus-win-x64-installer.zip

  build-linux:
    name: Linux packaging
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore solution
        run: dotnet restore "Nexus SourceCode/AgOpenGPS.Nexus.sln"

      - name: Build solution
        run: dotnet build "Nexus SourceCode/AgOpenGPS.Nexus.sln" --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test "Nexus SourceCode/AgOpenGPS.Nexus.sln" --no-build --configuration Release

      - name: Package Linux artifacts
        shell: pwsh
        run: ./tools/ci/package-linux.ps1 -Configuration Release -Runtime linux-x64

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            artifacts/linux/**
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-linux
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Prepare asset directory
        shell: bash
        run: |
          mkdir -p dist
          shopt -s nullglob globstar
          found=0
          for file in release/artifacts/**/AgOpenGPS.Nexus*; do
            if [ -f "$file" ]; then
              cp "$file" dist/
              found=1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "No release assets found in downloaded artifacts" >&2
            exit 1
          fi

      - name: Publish release assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Nexus ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.event.inputs.tag || github.ref_name, '-') }}
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
