name: Release
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9+]'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.semver.outputs.version }}
      prerelease: ${{ steps.semver.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: semver
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          echo "version=$VER" >> $GITHUB_OUTPUT
          if [[ "$VER" == *"-"* ]]; then echo "prerelease=true" >> $GITHUB_OUTPUT; else echo "prerelease=false" >> $GITHUB_OUTPUT; fi

  build-components:
    name: Build components
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        component: [ core, agio, ui ]
        runtime:   [ win-x64, linux-x64, linux-arm64 ]
        exclude:
          - component: ui
            runtime: linux-arm64
    uses: ./.github/workflows/build-components-reusable.yml
    with:
      component: ${{ matrix.component }}
      runtime:   ${{ matrix.runtime }}
      version:   ${{ needs.prepare.outputs.version }}

  build-plugins:
    name: Build plugins
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        plugin: [ Autosteer, Mapping, Guidance, SectionControl, FileIO, Sim, Telemetry, IsobusBridge ]
        runtime: [ win-x64, linux-x64, linux-arm64 ]
    uses: ./.github/workflows/build-components-reusable.yml
    with:
      component: plugin:${{ matrix.plugin }}
      runtime:   ${{ matrix.runtime }}
      version:   ${{ needs.prepare.outputs.version }}

  publish-components:
    name: Publish components to draft release
    runs-on: ubuntu-latest
    needs: [build-components, build-plugins, prepare]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: components }
      - name: Create/Update draft Release (components)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Nexus ${{ needs.prepare.outputs.version }} (components)"
          draft: true
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          body: |
            Components published. Bundles will be attached if assembly succeeds.
            This may remain components-only if some builds failed.
          files: components/**/*.{zip,tar.gz}

  assemble-bundles:
    name: Assemble bundles (strict)
    runs-on: ubuntu-latest
    needs: [build-components, build-plugins, prepare]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts }

      - name: Verify required artifacts
        run: |
          node packaging/scripts/resolve-expected.mjs bundles/base.bundle.json > required.txt
          { find artifacts -type f -name '*.zip' -printf '%f\n' ; find artifacts -type f -name '*.tar.gz' -printf '%f\n' ; } | sort > have.txt
          missing=false
          while read -r f; do
            grep -Fxq "$f" have.txt || { echo "MISSING: $f"; missing=true; }
          done < required.txt
          $missing && { echo "❌ Missing artifacts for bundle"; exit 1; }
          echo "✅ All required artifacts present."

      - name: Build bundles
        run: |
          mkdir -p bundle
          node packaging/scripts/assemble-base.mjs     "artifacts" "bundle/Nexus-Base"     "bundles/base.bundle.json"     "${{ needs.prepare.outputs.version }}"
          node packaging/scripts/assemble-headless.mjs "artifacts" "bundle/Nexus-Headless" "bundles/headless.bundle.json" "${{ needs.prepare.outputs.version }}"
          node packaging/scripts/assemble-uionly.mjs   "artifacts" "bundle/Nexus-UI"       "${{ needs.prepare.outputs.version }}"
          cd bundle
          zip -r "Nexus-Base_v${{ needs.prepare.outputs.version }}_win-x64.zip" Nexus-Base
          tar -czf "Nexus-Base_v${{ needs.prepare.outputs.version }}_linux-x64.tar.gz" Nexus-Base
          tar -czf "Nexus-Headless_v${{ needs.prepare.outputs.version }}_linux-arm64.tar.gz" Nexus-Headless
          zip -r "Nexus-UI_v${{ needs.prepare.outputs.version }}_win-x64.zip" Nexus-UI
          tar -czf "Nexus-UI_v${{ needs.prepare.outputs.version }}_linux-x64.tar.gz" Nexus-UI

      - name: Checksums
        working-directory: bundle
        run: |
          shopt -s nullglob
          for f in *.zip *.tar.gz; do sha256sum "$f" >> SHA256SUMS.txt; done

      - name: SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          path: bundle
          formats: spdx-json
          artifact-name: "sbom-v${{ needs.prepare.outputs.version }}"

      - name: Cosign sign (OIDC)
        env: { COSIGN_EXPERIMENTAL: "true" }
        run: |
          sudo wget -q https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64 -O /usr/local/bin/cosign
          sudo chmod +x /usr/local/bin/cosign
          cd bundle
          for f in *.zip *.tar.gz SHA256SUMS.txt; do cosign sign-blob --yes --output-signature "${f}.sig" --output-certificate "${f}.crt" "$f"; done

      - name: Upload bundles artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundles
          path: bundle/*

  attach-bundles-and-finalize:
    name: Attach bundles & finalize release
    runs-on: ubuntu-latest
    needs: [assemble-bundles, publish-components, prepare]
    if: ${{ needs.assemble-bundles.result == 'success' }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: bundles, path: bundle }
      - name: Update Release (finalize)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Nexus ${{ needs.prepare.outputs.version }}"
          draft: false
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          body: |
            ✅ Full bundles included. See SHA256 and SBOM assets.
          files: bundle/*.{zip,tar.gz,txt,crt,sig}

  mark-components-only:
    name: Mark components-only prerelease
    runs-on: ubuntu-latest
    needs: [assemble-bundles, publish-components, prepare]
    if: ${{ needs.assemble-bundles.result != 'success' }}
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Nexus ${{ needs.prepare.outputs.version }} (components-only)"
          draft: false
          prerelease: true
          body: |
            ⚠️ Components-only build. One or more builds failed; bundles were not produced.
            Check workflow logs for missing artifacts.
