syntax = "proto3";

package aog.core.v1;

option csharp_namespace = "Aog.Core.V1";

import "google/protobuf/timestamp.proto";

// Header captures metadata about a published message such as ordering and
// timestamping information. All core Nexus telemetry should embed this header
// as the first field to maintain consistent auditing semantics across
// transports.
message Header {
  // Monotonically increasing sequence number for the publisher.
  uint64 sequence = 1;

  // Best known timestamp at which the associated measurement was created.
  google.protobuf.Timestamp timestamp = 2;

  // Identifies the coordinate frame for position/pose data. Examples: "earth",
  // "vehicle".
  string frame = 3;

  // Free-form source identifier (e.g. "sim", "gps", "autosteer").
  string source = 4;
}

// Pose represents the fused navigation solution for the vehicle in WGS84 and
// vehicle-local references. Angles follow the right-hand rule and are in
// radians.
message Pose {
  Header header = 1;

  // Latitude in decimal degrees (WGS84).
  double latitude_deg = 2;

  // Longitude in decimal degrees (WGS84).
  double longitude_deg = 3;

  // Altitude above mean sea level in meters.
  double altitude_m = 4;

  // Heading in radians, measured clockwise from true north.
  double heading_rad = 5;

  // Vehicle roll (radians), positive when the right side is lower.
  double roll_rad = 6;

  // Vehicle pitch (radians), positive when the nose is up.
  double pitch_rad = 7;

  // Forward speed in meters per second.
  double speed_mps = 8;

  // Angular velocity around the vertical axis in radians per second.
  double yaw_rate_radps = 9;

  // Zone mask describing constraint state for the implement footprint at this sample.
  PoseZoneMask zone_mask = 10;
}

// PoseZoneMask summarises the spatial constraint context intersecting the implement
// footprint when a Pose sample was generated. The bitmask allows automation, logging,
// and replay services to reproduce operator-visible gating decisions per ADR-027.
message PoseZoneMask {
  // True when the implement footprint is within the configured boundary polygon.
  bool inside_boundary = 1;

  // True when the footprint is within a headland buffer derived from the boundary.
  bool inside_headland = 2;

  // True when the footprint intersects an enforced keep-out zone.
  bool inside_keep_out = 3;

  // True when the footprint intersects a work-disabled zone (drive allowed, work off).
  bool inside_work_disabled = 4;

  // Stable identifiers of the zones intersecting the footprint, ordered by priority.
  repeated string active_zone_ids = 5;

  // Hash of the zone registry snapshot that produced the mask, enabling drift detection.
  string zone_registry_hash = 6;
}

// Imu captures unprocessed measurements from an inertial measurement unit.
message Imu {
  Header header = 1;

  // Linear accelerations in the IMU body frame (m/s^2).
  double accel_x_mps2 = 2;
  double accel_y_mps2 = 3;
  double accel_z_mps2 = 4;

  // Angular rates in the IMU body frame (rad/s).
  double gyro_x_radps = 5;
  double gyro_y_radps = 6;
  double gyro_z_radps = 7;

  // Magnetic field estimates in microtesla.
  double mag_x_ut = 8;
  double mag_y_ut = 9;
  double mag_z_ut = 10;

  // Optional board temperature in degrees Celsius.
  double temperature_c = 11;
}

// SectionMask communicates which boom/section outputs should currently be
// active. Bits are mapped least-significant-bit first.
message SectionMask {
  Header header = 1;

  // Number of valid bits within the mask.
  uint32 section_count = 2;

  // Packed bit mask; bit N corresponds to section N (0-based).
  uint32 mask = 3;
}

// SteerCmd requests a steering controller action from AGiO hardware.
message SteerCmd {
  Header header = 1;

  // Desired wheel angle in degrees (positive = turn right).
  double target_wheel_angle_deg = 2;

  // Feed-forward term supplied by the controller for host-side logging.
  double feed_forward = 3;

  // Closed-loop PID output or equivalent control effort.
  double controller_output = 4;

  // When true, the controller should actively control steering actuators.
  bool enable = 5;
}

// SteerState reports measured steering information from hardware back to Core.
message SteerState {
  Header header = 1;

  // Measured wheel angle in degrees.
  double measured_wheel_angle_deg = 2;

  // Last command effort applied by the actuator (scaled 0-1).
  double applied_effort = 3;

  // Current lateral error of the guidance solution in meters.
  double lateral_error_m = 4;

  // Current heading error in radians (positive = vehicle heading clockwise
  // relative to path heading).
  double heading_error_rad = 5;

  // Indicates whether the hardware is currently engaged.
  bool engaged = 6;
}

// CanFrame represents a single CAN bus frame exchanged with legacy hardware.
message CanFrame {
  Header header = 1;

  // CAN arbitration identifier (11 or 29 bit depending on extended flag).
  uint32 arbitration_id = 2;

  // Raw CAN payload bytes (0-8 bytes).
  bytes payload = 3;

  // True when the frame uses the extended 29-bit identifier format.
  bool is_extended_id = 4;

  // Remote Transmission Request flag.
  bool is_remote_request = 5;
}

// TimingCaps summarises the timing/clock capabilities detected on the host.
message TimingCaps {
  Header header = 1;

  // Host observes a 1PPS reference pulse.
  bool has_pps = 2;

  // Host is synchronized via Precision Time Protocol (PTP).
  bool has_ptp = 3;

  // Host can provide a GNSS-derived time base.
  bool has_gnss_time = 4;

  // Estimated oscillator skew in parts-per-million relative to reference.
  double estimated_skew_ppm = 5;

  // Uncertainty of the system clock in nanoseconds (1-sigma).
  double clock_uncertainty_ns = 6;
}

// PlanterRowQuality classifies the current quality of a planter row's seed
// drop behaviour relative to the configured target population.
enum PlanterRowQuality {
  // Quality has not been evaluated.
  PLANTER_ROW_QUALITY_UNKNOWN = 0;

  // Row is operating within configured tolerance bands.
  PLANTER_ROW_QUALITY_OK = 1;

  // Row is experiencing skips relative to the target population.
  PLANTER_ROW_QUALITY_SKIP = 2;

  // Row is experiencing doubles relative to the target population.
  PLANTER_ROW_QUALITY_DOUBLE = 3;
}

// PlanterRowStatus reports the instantaneous status of a single planter row.
message PlanterRowStatus {
  // Telemetry header describing sequence, timestamp, and source metadata.
  Header header = 1;

  // Zero-based planter row index.
  uint32 row_index = 2;

  // Target seed population expressed as seeds per meter.
  double target_population_per_meter = 3;

  // Measured seed population expressed as seeds per meter.
  double actual_population_per_meter = 4;

  // Fractional skip rate (0-1) relative to the configured skip threshold.
  double skip_rate = 5;

  // Fractional double rate (0-1) relative to the configured double threshold.
  double double_rate = 6;

  // Evaluated quality classification for the row.
  PlanterRowQuality quality = 7;
}

// CombineYieldCell summarises the averaged yield/moisture data for a spatial cell.
message CombineYieldCell {
  // Column index within the publish grid (0 at field origin east edge).
  uint32 column = 1;

  // Row index within the publish grid (0 at field origin north edge).
  uint32 row = 2;

  // Average wet yield scaled to kilograms per hectare for the cell.
  double average_yield_kg_per_hectare = 3;

  // Average crop moisture percentage (0-100). Zero indicates unavailable.
  double average_moisture_percent = 4;

  // Number of raw measurements aggregated into the cell.
  uint32 sample_count = 5;
}

// CombineYieldLayer aggregates combine yield measurements into a grid suitable
// for UI overlays and data export workflows.
message CombineYieldLayer {
  // Telemetry header describing sequence, timestamp, and source metadata.
  Header header = 1;

  // Crop name associated with the layer (e.g. "Corn").
  string crop = 2;

  // Edge length of each grid cell in meters.
  double cell_size_meters = 3;

  // Averaged cells composing the layer.
  repeated CombineYieldCell cells = 4;
}

// ZoneType distinguishes the kind of constraint represented by a zone.
enum ZoneType {
  // Zone type has not been assigned.
  ZONE_TYPE_UNSPECIFIED = 0;

  // Field or project boundary.
  ZONE_TYPE_BOUNDARY = 1;

  // Headland region derived from boundary buffers.
  ZONE_TYPE_HEADLAND = 2;

  // Hard keep-out / no-go area.
  ZONE_TYPE_KEEP_OUT = 3;

  // Driveable region where work is disabled (product off, logging only).
  ZONE_TYPE_WORK_DISABLED = 4;
}

// ZoneCoordinate represents a longitude/latitude coordinate with optional elevation.
message ZoneCoordinate {
  // Longitude in decimal degrees (WGS84).
  double longitude_deg = 1;

  // Latitude in decimal degrees (WGS84).
  double latitude_deg = 2;

  // Optional elevation in meters above mean sea level.
  double elevation_m = 3;
}

// ZoneLinearRing describes a closed polygon ring where the first and last coordinates
// are identical.
message ZoneLinearRing {
  // Vertices composing the ring (clockwise for exterior, counter-clockwise for holes).
  repeated ZoneCoordinate vertices = 1;
}

// ZonePolygon captures the buffered polygon applied to a zone, including any interior holes.
message ZonePolygon {
  // Exterior ring of the polygon.
  ZoneLinearRing exterior = 1;

  // Interior rings that should be excluded from the polygon.
  repeated ZoneLinearRing holes = 2;
}

// ZoneBuffers specify drive vs. work clearance margins in meters.
message ZoneBuffers {
  // Lateral clearance needed to safely drive near the zone boundary.
  double drive_m = 1;

  // Clearance required to perform work (product application, tillage, etc.).
  double work_m = 2;
}

// ZoneValidWhen expresses optional conditional metadata that scopes zone applicability.
message ZoneValidWhen {
  // Crop name (e.g. "corn") for which the zone applies. Empty means all crops.
  string crop = 1;

  // Season identifier (e.g. "2026"). Empty means all seasons.
  string season = 2;

  // Additional arbitrary conditions (e.g. weather presets) understood by policy engines.
  repeated string conditions = 3;
}

// ZoneProvenance records the source of a zone for auditing and replay.
message ZoneProvenance {
  // Source that authored the zone (import type, editor, automation).
  string source = 1;

  // Timestamp when the zone was created or last updated.
  google.protobuf.Timestamp timestamp = 2;

  // Optional free-form note about the change rationale.
  string note = 3;
}

// Zone represents a buffered polygon with constraint metadata.
message Zone {
  // Stable identifier for the zone (UUID string).
  string zone_id = 1;

  // Classification for the zone.
  ZoneType type = 2;

  // Human-readable label shown in UIs.
  string label = 3;

  // Priority ordering when multiple zones overlap (higher wins).
  uint32 priority = 4;

  // Whether the zone is currently active/enabled.
  bool enabled = 5;

  // Buffered polygon geometry in the project CRS.
  ZonePolygon geometry = 6;

  // Drive/work clearance buffers.
  ZoneBuffers buffers = 7;

  // Optional conditions that gate when the zone applies.
  ZoneValidWhen valid_when = 8;

  // Provenance metadata for auditing.
  ZoneProvenance provenance = 9;
}

// ListZonesRequest queries all known zones optionally including disabled entries.
message ListZonesRequest {
  // Include disabled zones in the response when true.
  bool include_disabled = 1;
}

// ListZonesResponse returns the zones known to the service at call time.
message ListZonesResponse {
  repeated Zone zones = 1;
}

// WatchZonesRequest subscribes to incremental zone updates.
message WatchZonesRequest {
  // Include disabled zones in update streams when true.
  bool include_disabled = 1;
}

// ZoneDelta communicates added/updated and deleted zones in a snapshot-consistent order.
message ZoneDelta {
  // Snapshot version the delta applies to.
  uint64 version = 1;

  // Upserted zones (create/update events).
  repeated Zone upserts = 2;

  // Identifiers for deleted zones.
  repeated string deleted_zone_ids = 3;
}

// WatchZonesResponse streams zone deltas after an initial snapshot.
message WatchZonesResponse {
  // Full snapshot sent on the first response.
  repeated Zone snapshot = 1;

  // Incremental deltas after the snapshot is emitted.
  repeated ZoneDelta deltas = 2;
}

// GetZonesInBoundsRequest filters zones intersecting a bounding box.
message GetZonesInBoundsRequest {
  // Minimum longitude (degrees) of the bounding box.
  double min_longitude_deg = 1;

  // Minimum latitude (degrees) of the bounding box.
  double min_latitude_deg = 2;

  // Maximum longitude (degrees) of the bounding box.
  double max_longitude_deg = 3;

  // Maximum latitude (degrees) of the bounding box.
  double max_latitude_deg = 4;

  // Include disabled zones when true.
  bool include_disabled = 5;
}

// GetZonesInBoundsResponse returns the zones intersecting the requested bounds.
message GetZonesInBoundsResponse {
  repeated Zone zones = 1;
}

// ZoneService exposes spatial constraint zones to automation and UI consumers.
service ZoneService {
  // Returns the current list of known zones.
  rpc ListZones(ListZonesRequest) returns (ListZonesResponse);

  // Streams zone snapshot and incremental updates.
  rpc WatchZones(WatchZonesRequest) returns (stream WatchZonesResponse);

  // Retrieves zones that intersect the specified bounding box.
  rpc GetZonesInBounds(GetZonesInBoundsRequest) returns (GetZonesInBoundsResponse);
}
